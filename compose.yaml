services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.3'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.3/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            APP_ENV: '${APP_ENV:-local}'
            APP_DEBUG: '${APP_DEBUG:-true}'
            APP_URL: '${APP_URL:-http://localhost}'
            CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}'
            CORS_SUPPORTS_CREDENTIALS: '${CORS_SUPPORTS_CREDENTIALS:-true}'
            JWT_COOKIE_NAME: '${JWT_COOKIE_NAME:-condominios_token}'
            JWT_COOKIE_PATH: '${JWT_COOKIE_PATH:-/}'
            JWT_COOKIE_DOMAIN: '${JWT_COOKIE_DOMAIN:-null}'
            JWT_COOKIE_SECURE: '${JWT_COOKIE_SECURE:-false}'
            JWT_COOKIE_HTTP_ONLY: '${JWT_COOKIE_HTTP_ONLY:-true}'
            JWT_COOKIE_SAME_SITE: '${JWT_COOKIE_SAME_SITE:-lax}'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - redis
    redis:
        image: 'redis:7-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-redis:
        driver: local
